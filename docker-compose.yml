version: "3.9"
services:
  app:
    build: .
    container_name: combustible-app
    ports:
      - "8000:8000"
    volumes:
      - combustible_data:/app/data
      - combustible_backups:/app/backups
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:////app/data/combustible.db
volumes:
  combustible_data:
  combustible_backups:
